name: Publish to Firefox Add-ons

on:
  workflow_call:
    inputs:
      tag:
        description: Existing stable GitHub Release tag
        required: true
        type: string
      dry_run:
        description: Validate without uploading or changing AMO
        default: true
        type: boolean
    secrets:
      AMO_JWT_ISSUER:
        required: false
      AMO_JWT_SECRET:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing stable GitHub Release tag (e.g. v1.2.0)'
        required: true
        type: string
      dry_run:
        description: Validate without uploading or changing AMO
        default: true
        type: boolean

permissions:
  contents: read

# Serialize all listed submissions, including manual retries. Never cancel an upload.
concurrency:
  group: firefox-addons-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify release and submit Firefox package with source
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out publishing script
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download existing release artifacts and resolve source revision
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          python3 scripts/publish-checksums.py "$RELEASE_TAG" \
            "release/wupage-${version}-firefox.zip" \
            "release/wupage-${version}-firefox-source.zip"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "wupage-${version}-firefox.zip" \
            --pattern "wupage-${version}-firefox-source.zip" \
            --dir release
          commit="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}" --jq '.sha')"
          echo "RELEASE_COMMIT=$commit" >> "$GITHUB_ENV"

      - name: Validate or submit to AMO
        env:
          AMO_ADDON_ID: ${{ vars.AMO_ADDON_ID }}
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          RELEASE_TAG: ${{ inputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          flags=()
          if [[ "$DRY_RUN" == "true" ]]; then
            flags+=(--dry-run)
          fi
          python3 scripts/publish-firefox.py \
            "release/wupage-${RELEASE_TAG#v}-firefox.zip" \
            "release/wupage-${RELEASE_TAG#v}-firefox-source.zip" \
            "${flags[@]}"
