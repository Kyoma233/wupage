name: Publish to Microsoft Edge Add-ons

on:
  workflow_call:
    inputs:
      tag:
        description: Existing stable GitHub Release tag
        required: true
        type: string
    secrets:
      EDGE_CLIENT_ID:
        required: true
      EDGE_API_KEY:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing stable GitHub Release tag (e.g. v1.1.3)'
        required: true
        type: string

permissions:
  contents: read

# All versions share the same store draft. Never cancel an in-flight submission.
concurrency:
  group: edge-addons-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    name: Upload release ZIP and submit for certification
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out publishing script
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate configuration
        env:
          EDGE_PRODUCT_ID: ${{ vars.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
        run: |
          python3 - <<'PY'
          import os
          missing = [name for name in ('EDGE_PRODUCT_ID', 'EDGE_CLIENT_ID', 'EDGE_API_KEY')
                     if not os.environ.get(name, '').strip()]
          if missing:
              raise SystemExit('Configure these GitHub Actions variables/secrets first: ' + ', '.join(missing))
          PY

      - name: Download and verify the existing release package
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, subprocess
          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', tag):
              raise SystemExit('Only stable v<major>.<minor>.<patch> releases can be submitted to the store.')
          release = json.loads(subprocess.check_output([
              'gh', 'release', 'view', tag, '--repo', os.environ['GITHUB_REPOSITORY'],
              '--json', 'tagName,isDraft,isPrerelease',
          ], text=True))
          if release['tagName'] != tag or release['isDraft'] or release['isPrerelease']:
              raise SystemExit('The requested GitHub Release must be published and stable.')
          PY
          archive="wupage-${RELEASE_TAG#v}-edge.zip"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$archive" \
            --pattern "${archive}.sha256" \
            --dir release
          (cd release && sha256sum --check "${archive}.sha256")

      - name: Upload package and submit for Microsoft certification
        env:
          EDGE_PRODUCT_ID: ${{ vars.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: python3 scripts/publish-edge.py "release/wupage-${RELEASE_TAG#v}-edge.zip"
